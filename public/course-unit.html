<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unidad · Comunicaciones Industriales</title>
  <link rel="stylesheet" href="/css/landing.css" />
  <link rel="stylesheet" href="/css/course.css" />
</head>

<body>
  <header class="site-header">
    <div class="accent-bar"></div>
    <nav class="nav">
      <a href="/" class="nav-brand">
        <span class="nav-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="3" />
            <path d="M9 9h6v6H9z" />
            <path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2" />
          </svg>
        </span>
      </a>
      <div class="breadcrumb-trail">
        <a href="/course.html">Mi curso</a>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-current" id="breadcrumbUnit">Cargando...</span>
      </div>
    </nav>
  </header>

  <main class="course-wrap">
    <p class="topics-eyebrow" id="unitEyebrow">Unidad</p>
    <h1 id="unitTitle">Cargando...</h1>
    <p class="unit-lead" id="unitDescription"></p>

    <p class="topics-count-label" id="topicsCountLabel"></p>

    <div class="topic-list" id="topicsList">
      <p class="empty-state">Cargando temas...</p>
    </div>

    <a href="#" id="quizCard" class="quiz-card" style="display: none;">
      <span class="quiz-card-icon" aria-hidden="true">📝</span>
      <span class="quiz-card-info">
        <span class="quiz-card-label">Quiz de la unidad</span>
        <span class="quiz-card-title" id="quizCardTitle"></span>
      </span>
      <svg class="topic-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6l6 6-6 6" />
      </svg>
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/course-unit.js"></script>
</body>

</html>
