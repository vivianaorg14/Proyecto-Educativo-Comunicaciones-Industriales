<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Comunicaciones Industriales</title>
  <link rel="stylesheet" href="/css/landing.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>

<body>
  <header class="site-header">
    <div class="accent-bar"></div>
    <nav class="nav">
      <a href="/" class="nav-brand">
        <span class="nav-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="3" />
            <path d="M9 9h6v6H9z" />
            <path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2" />
          </svg>
        </span>
      </a>

      <div class="nav-actions">
        <div class="user-chip">
          <span class="user-avatar" id="userAvatar">--</span>
          <span class="user-chip-text">
            <span class="user-chip-name" id="userName">Cargando...</span>
            <span class="user-chip-email" id="userEmail"></span>
          </span>
        </div>
        <button type="button" id="logoutBtn" class="btn btn-outline">Cerrar sesión</button>
      </div>
    </nav>
  </header>

  <main class="dash-wrap">
    <section class="welcome-banner">
      <p class="welcome-eyebrow" id="welcomeEyebrow">Bienvenido de vuelta</p>
      <h1 id="welcomeName">Cargando...</h1>
      <p id="welcomeSub"></p>
    </section>

    <div class="section-head-row">
      <h2>Unidades del curso</h2>
    </div>
    <div class="units-dash-grid" id="unitsGrid">
      <p class="empty-state">Cargando unidades....</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/dashboard.js"></script>
</body>

</html>
